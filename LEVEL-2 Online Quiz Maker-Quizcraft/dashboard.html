<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - QuizCraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>QuizCraft Dashboard</h1>
    <p class="tagline">What would you like to do?</p>

    <div class="buttons">
        <button onclick="window.location.href='create.html'">Create Quiz</button>
        <button onclick="window.location.href='quiz.html'">Take Quiz</button>
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// Protect dashboard
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});

// Logout functionality
const logoutBtn = document.getElementById("logoutBtn");

logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    alert("Logged out successfully!");
    window.location.href = "index.html";
});
</script>

</body>
</html>
