<!DOCTYPE html>
<html>
<head>
<title>Play Quiz - QuizCraft</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h3 id="progress"></h3>

<h2 id="question"></h2>

<div id="options" class="buttons"></div>

<br>

<button id="nextBtn" disabled>Next Question</button>

</div>

<script>

const quiz = JSON.parse(localStorage.getItem("selectedQuiz"));

let currentQuestion = 0;
let score = 0;

const progress = document.getElementById("progress");
const question = document.getElementById("question");
const optionsDiv = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");


function loadQuestion(){

    const q = quiz.questions[currentQuestion];

    // Display number starts from 1
    const displayNumber = currentQuestion + 1;

    progress.textContent = "Question " + displayNumber + " / " + quiz.questions.length;

    question.textContent = q.question;

    optionsDiv.innerHTML = "";

    q.options.forEach((opt,i)=>{

        const btn = document.createElement("button");

        btn.textContent = opt;

        btn.onclick = ()=>checkAnswer(btn,i,q.correctAnswer);

        optionsDiv.appendChild(btn);

    });

    nextBtn.disabled = true;

}


function checkAnswer(btn,selected,correct){

    const buttons = document.querySelectorAll("#options button");

    buttons.forEach(b=>b.disabled = true);

    if(selected === correct){

        btn.style.background = "#00ff9c";
        score++;

    }else{

        btn.style.background = "#ff4d4d";
        buttons[correct].style.background = "#00ff9c";

    }

    nextBtn.disabled = false;

}


nextBtn.onclick = ()=>{

    currentQuestion++;

    if(currentQuestion < quiz.questions.length){

        loadQuestion();

    }else{

        alert("Quiz Completed!\nScore: " + score + " / " + quiz.questions.length);

        window.location.href = "dashboard.html";

    }

};

loadQuestion();

</script>

</body>
</html>
